name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 红线自查（真实 IP/网段前缀禁入库）
        shell: bash
        run: |
          if git grep -E "63\.125|183\.232|23\.132|172\.253|103\.142|74\.125" -- . ':!AGENTS.md'; then
            echo "::error::敏感信息命中红线（AGENTS.md 白名单外）"
            exit 1
          fi

      - name: 全量测试
        run: python -m pytest tests/ -q

      - name: PyInstaller 打包
        run: python -m PyInstaller claude-guard.spec --noconfirm

      - name: 组装发布包
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/ClaudeGuard.exe, config.example.json, install_task.ps1, uninstall.ps1, 一键切换防火墙状态.cmd, README.md pkg/
          7z a "ClaudeGuard-$v.zip" ./pkg/* | Out-Null

      - name: 上传构建产物（任何触发都保留）
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeGuard-${{ github.ref_name }}
          path: ClaudeGuard-${{ github.ref_name }}.zip
          retention-days: 30

      - name: 创建 Release 并上传 zip（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "ClaudeGuard-${{ github.ref_name }}.zip" --title "ClaudeGuard ${{ github.ref_name }}" --generate-notes
